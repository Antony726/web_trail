<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact & Booking | Liya Bridal Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="site-header"></div>
<section class="page-hero"><div class="container"><span class="eyebrow">Get In Touch</span><h1 class="title">Contact &amp; <span class="gold-text">Booking</span></h1></div></section>

<section id="book">
  <div class="container split" style="align-items:start">
    <div class="reveal">
      <h2 class="title">Book Your <span class="gold-text">Appointment</span></h2>
      <div class="divider"></div>
      <form id="booking-form">
        <div class="form-row"><input name="name" placeholder="Your Name" required><input name="phone" type="tel" placeholder="Phone Number" required></div>
        <div class="form-col"><select name="service" required>
          <option value="">Select Service</option><option>Bridal Makeup</option><option>Hair Styling</option><option>Facial &amp; Skin</option><option>Nails</option><option>Mehendi</option><option>Saree Draping</option><option>Pre-Wedding Package</option></select></div>
        <div class="form-row"><input name="date" type="date" required><input name="time" type="time" required></div>
        <div class="form-col"><textarea name="notes" rows="4" placeholder="Anything we should know?"></textarea></div>
        <button class="btn btn-gold" type="submit">Send via WhatsApp</button>
      </form>
    </div>
    <div class="reveal">
      <h2 class="title">Visit <span class="gold-text">Us</span></h2>
      <div class="divider"></div>
      <ul class="contact-info">
        <li><div class="ic">📍</div><div><b>Address</b>Liya Bridal Studio, Coimbatore, Tamil Nadu</div></li>
        <li><div class="ic">📞</div><div><b>Phone</b>+91 99999 99999</div></li>
        <li><div class="ic">✉️</div><div><b>Email</b>hello@liyabridalstudio.com</div></li>
        <li><div class="ic">🕘</div><div><b>Hours</b>Mon–Sun, 9:30 AM – 8:00 PM</div></li>
      </ul>
      <div class="map"><p style="margin-bottom:16px">Find us on Google Maps</p><a class="btn btn-gold" target="_blank" rel="noopener" href="https://maps.app.goo.gl/umKqad4AdPV7cdjV6">Open Directions</a></div>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<script src="script.js"></script>
</body>
</html>
